[CX]
Language=ja

[WebView2]
CXROOT=C:\app\laz\CXComponents\runtime
LoaderDllPath=%CXROOT%\WebView2Loader.dll
UserDataFolder=%CXROOT%\WebView2Data
MonacoFolder=%CXROOT%\monaco
PreviewFolder=%CXROOT%\preview
TerminalFolder=%CXROOT%\terminal

[CaiClient]
TimeoutSeconds=120
RetryCount=2
RetryWaitSeconds=3
LogFolder=

[CaiGemini]
Url=https://generativelanguage.googleapis.com/v1beta/models/%Model%:generateContent
Model=gemini-3.8-flash
ApiKeyEnv=GEMINI_API_KEY

[CaiOllama]
Url=http://localhost:11434/api/chat
Model=gemma3:4b
ApiKeyEnv=

[CaiChatGPT]
Url=https://api.openai.com/v1/chat/completions
Model=gpt-4o-mini
ApiKeyEnv=OPENAI_API_KEY

[CaiMeta]
Url=https://api.meta.ai/v1/chat/completions
Model=muse-spark-1.3
ApiKeyEnv=MODEL_API_KEY

[CaiClaude]
Url=https://api.anthropic.com/v1/messages
Model=claude-haiku-5-5
ApiKeyEnv=CX_ANTHROPIC_API_KEY
