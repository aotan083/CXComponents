; 
; GlobalWebView2Loader setup file.
;
[WebView2]
LoaderDllPath=C:\app\laz\CXComponents\runtime\WebView2Loader.dll
UserDataFolder=C:\app\laz\CXComponents\runtime\WebView2Data
MonacoFolder=C:\app\laz\CXComponents\runtime\monaco
PreviewFolder=C:\app\laz\CXComponents\runtime\preview

; cx の部品が画面に出す文字の言語（ja / en）。
; 空・行が無いときは Windows の表示言語（日本語なら ja、それ以外は en）
[CX]
Language=ja
